<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aurora Calculator is a modern calculator with history, memory, and a polished interface.">
  <link rel="stylesheet" href="style.css">
  <title>Calculator</title>
</head>
<body>
  <div class="app-shell">
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>

    <main class="calculator-card">
      <header class="card-header">
        <div>
          <p class="eyebrow">Workspace</p>
          <h1>Calculator</h1>
        </div>
        <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle theme">🌙</button>
      </header>

      <section class="display-panel">
        <div class="display-head">
          <span>Expression</span>
          <span id="themeLabel">Dark mode</span>
        </div>
        <input id="display" type="text" inputmode="decimal" spellcheck="false" value="2+2" aria-label="calculator display">
        <div class="result-row">
          <span class="result-label">Result</span>
          <div id="resultChip" class="result-chip">4</div>
        </div>
      </section>

      <section class="toolbar" aria-label="calculator toolbar">
        <button class="toolbar-btn" data-action="backspace" type="button">⌫</button>
        <button class="toolbar-btn" data-action="clear" type="button">Clear</button>
        <button class="toolbar-btn" data-action="copy" type="button">Copy</button>
        <button class="toolbar-btn" data-action="history-toggle" type="button">History</button>
        <button class="toolbar-btn" data-action="memory-clear" type="button">MC</button>
        <button class="toolbar-btn" data-action="memory-recall" type="button">MR</button>
        <button class="toolbar-btn" data-action="memory-add" type="button">M+</button>
        <button class="toolbar-btn" data-action="memory-subtract" type="button">M-</button>
      </section>

      <section id="buttons" class="buttons-grid" aria-label="calculator buttons"></section>

      <section class="insights">
        <div class="stats-card">
          <div class="stats-title">Memory</div>
          <div id="memoryValue" class="stats-value">0</div>
        </div>
        <div class="history-card">
          <div class="history-title">Recent</div>
          <ul id="historyList" class="history-list"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="index.js"></script>
</body>
</html>
